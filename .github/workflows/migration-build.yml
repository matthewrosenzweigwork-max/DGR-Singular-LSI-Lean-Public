name: Migration source build
run-name: Migration source build at ${{ github.sha }}
on:
  push:
    branches: [palomar-migration-2026-10-16]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A full-preflight marker skips this job and must not cancel an active source build.
  group: migration-${{ github.repository }}-${{ github.ref }}${{ contains(github.event.head_commit.message, '[palomar-full]') && '-full-skip' || '' }}${{ contains(github.event.head_commit.message, '[const-inspect]') && github.sha || '' }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[palomar-full]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: '2'
    strategy:
      fail-fast: false
      matrix:
        # This filter affects diagnostic builds only; full verification always checks both components.
        component: ${{ fromJSON(contains(github.event.head_commit.message, '[whole-space-only]') && '["whole-space"]' || contains(github.event.head_commit.message, '[periodic-only]') && '["periodic"]' || '["periodic", "whole-space"]') }}
    defaults:
      run:
        shell: bash
        working-directory: trials/${{ matrix.component }}/project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check migration and preserved proof text
        working-directory: .
        run: python3 scripts/check_migration.py
      - name: Install official elan with pinned installer
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/9605b24b08cf68b78dce0014b6fa01be1f8e2cee/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Record runner capacity and exact Lean version
        run: |
          uname -a
          free -h
          df -h .
          lean --version
          lake --version
      - name: Obtain the pinned dependency cache
        run: |
          set -o pipefail
          lake exe cache get 2>&1 | tee "$RUNNER_TEMP/cache.log"
      - name: Build migrated source from fresh project objects
        run: |
          set -o pipefail
          if ${{ contains(github.event.head_commit.message, '[const-inspect]') }}; then
            lake build Challenge Solution 2>&1 | tee "$RUNNER_TEMP/build.log"
          else
            lake build Tablet Challenge Solution 2>&1 | tee "$RUNNER_TEMP/build.log"
          fi
      - name: Inspect strict constant correspondence
        if: ${{ contains(github.event.head_commit.message, '[const-inspect]') }}
        run: |
          set -o pipefail
          lake env lean --run ../../../scripts/compare_whole_space_constants.lean Challenge Solution ${{ matrix.component }} 2>&1 | tee "$RUNNER_TEMP/constants.jsonl"
      - name: Check migrated source did not drift
        if: always()
        working-directory: .
        run: python3 scripts/check_migration.py
      - name: Preserve actual build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-${{ matrix.component }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cache.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/constants.jsonl
          if-no-files-found: warn
          retention-days: 30
