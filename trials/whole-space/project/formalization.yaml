project:
  name: Whole-space Riesz Poincare inequalities beyond Gaussian references
  description: Particle-number-uniform whole-space Riesz Poincare inequalities in dimension d >= 3
    for 0 < s <= d-2. The recorded bounded-Hessian and growth-class endpoints cover uniformly convex
    one-particle references, bounded positive measurable multipliers, bounded nonnegative coupling
    intervals, positive cutoffs and the singular zero-cutoff limit. Both growth-class statements retain
    their complete class-uniform, individual-potential, and Gaussian-specialization clauses. The inequalities
    apply on the closed physical gradient graph. No whole-space logarithmic Sobolev inequality is
    claimed.
