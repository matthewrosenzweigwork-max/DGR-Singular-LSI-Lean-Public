project:
  name: Periodic logarithmic Sobolev and Poincare inequalities for singular Riesz gases
  description: Particle-number-uniform periodic Poincare inequalities and logarithmic Sobolev inequalities
    for log/Riesz Gibbs laws with measurable backgrounds bounded above and away from zero, including
    modulated laws and bounded external potentials. The statements include closed-gradient domain
    identities. The Poincare range is 0 <= s <= d-2 for d >= 2; LSI additionally requires s < d/2.
    Rates are uniform over bounded nonnegative coupling intervals and nonnegative cutoff parameters,
    with the bounds and other kernel parameters fixed. This entry selects the periodic component;
    whole-space results require the separate whole-space configuration.
